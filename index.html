<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Berhasil</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #f0f4f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #333;
      text-align: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 600px;
      width: 100%;
    }

    .illustration {
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5em;
      color: #555;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2em;
      color: #555;
      margin-bottom: 30px;
    }

    footer {
      font-size: 0.9em;
      color: #aaa;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2em;
      }
      p {
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="illustration">
    </div>
    <h1>Berhasil Membuat Situs</h1>
    <p>Silahkan Konfigurasi ya . . .</p>
   <footer>&copy; <span id="year"></span> Melayani Dengan Sepenuh Hati</footer>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
  </div>
</body>
</html>
